services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: brewing_journal
      POSTGRES_PASSWORD: "gSZvIcj2QDJJ7W7yyA15bbKhxq1ujtzB"
    volumes:
      - brewing_journal_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "41IvVYXTAjcZYnzDxuOIjDmIiZGmsRC3"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: brewing_journal_test
      POSTGRES_PASSWORD: "5ZUxrfOUL4CjPQ8_pTujr2sdjq-DZ8IZ"
    volumes:
      - brewing_journal_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "vaPbSyNAGr3M8kQ7X0M-KlLClgCLrQ9p"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  brewing_journal_data:
  brewing_journal_test_data:
